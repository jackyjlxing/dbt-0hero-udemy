version: 2

models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings
    columns:
      - name: listing_id
        description: primary key for listing
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null
          - relationships:
              field: host_id
              to: ref('dim_hosts_cleansed')

      - name: room_type
        tests:
          - accepted_values:
              values:
                - 'Entire home/apt'
                - 'Private room' 
                - 'Shared room' 
                - 'Hotel room'

      - name: minimum_nights
        tests:
          - positive_value

  - name: dim_hosts_cleansed
    description: cleansed hosts dimension model